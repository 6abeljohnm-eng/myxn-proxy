<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="screen active">
    <div class="login-container">
      <div class="login-box">
        <h1>StudyHub</h1>
        <p>Access Code</p>
        <input 
          type="password" 
          id="password-input" 
          placeholder="Enter code"
          autocomplete="off"
        >
        <button id="login-btn">Enter</button>
        <p id="error-msg" class="error-hidden">Invalid code</p>
      </div>
    </div>
  </div>

  <!-- Mode Selection -->
  <div id="mode-screen" class="screen">
    <div class="mode-container">
      <h1>Select Mode</h1>
      <div class="mode-grid">
        <button class="mode-card os-btn" data-mode="os">
          <span class="mode-icon">🖥️</span>
          <span>Desktop</span>
        </button>
        <button class="mode-card games-btn" data-mode="games">
          <span class="mode-icon">🎮</span>
          <span>Games</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Desktop OS -->
  <div id="os-screen" class="screen">
    <div class="desktop">
      <!-- Sidebar Icons -->
      <div class="sidebar">
        <div class="sidebar-icon" data-window="browser" title="Browser">🌐</div>
        <div class="sidebar-icon" data-window="movies" title="Movies">🎬</div>
        <div class="sidebar-icon" data-window="games" title="Games">🎮</div>
        <div class="sidebar-icon" data-window="chat" title="Chat">💬</div>
        <div class="sidebar-icon" data-window="settings" title="Settings">⚙️</div>
      </div>

      <!-- Windows Area -->
      <div class="windows-area" id="windows-area"></div>

      <!-- Taskbar -->
      <div class="taskbar">
        <div class="taskbar-left" id="taskbar-left"></div>
        <div class="taskbar-center" id="clock">00:00</div>
      </div>
    </div>
  </div>

  <!-- Games Screen -->
  <div id="games-screen" class="screen">
    <div class="games-container">
      <h1>Games</h1>
      <input type="text" id="games-search" placeholder="Search games..." class="search-bar">
      <div id="games-grid" class="games-grid"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
