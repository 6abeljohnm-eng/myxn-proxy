<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy - StudyHub</title>
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <script>
    // Initialize Ultraviolet
    window.uvConfig = {
      prefix: '/uv/',
      codec: 'xor',
      loglevel: 'debug',
    };
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #050810;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #00d9ff;
      font-size: 14px;
      z-index: 1000;
    }
    
    .spinner {
      border: 3px solid rgba(0, 217, 255, 0.1);
      border-top-color: #00d9ff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Loading proxy...</div>
  </div>
  
  <iframe id="proxy-frame"></iframe>
  
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('url');
    
    if (!targetUrl) {
      document.body.innerHTML = '<div style="padding: 20px; color: #00d9ff; text-align: center;">No URL specified</div>';
    } else {
      try {
        const proxyUrl = UV.rewrite(decodeURIComponent(targetUrl));
        document.getElementById('proxy-frame').src = proxyUrl;
        
        document.getElementById('proxy-frame').onload = () => {
          document.getElementById('loading').style.display = 'none';
        };
        
        document.getElementById('proxy-frame').onerror = () => {
          document.getElementById('loading').innerHTML = '<div style="color: #ff6b6b;">Failed to load proxy</div>';
        };
      } catch (error) {
        console.error('Proxy error:', error);
        document.getElementById('loading').innerHTML = '<div style="color: #ff6b6b;">Proxy error: ' + error.message + '</div>';
      }
    }
  </script>
</body>
</html>
