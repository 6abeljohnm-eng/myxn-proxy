<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Proxy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #b794f6;
      --secondary: #10b981;
      --accent: #d97706;
      --bg-darkest: #0f0a1a;
      --bg-dark: #1a1a2e;
      --border-color: rgba(183, 148, 246, 0.2);
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-darkest);
      color: var(--text-primary);
      overflow: hidden;
    }

    .navbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border-color);
      height: 56px;
    }

    .nav-btn {
      padding: 8px 12px;
      background: rgba(183, 148, 246, 0.1);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .nav-btn:hover {
      background: var(--primary);
      color: var(--bg-darkest);
      border-color: var(--primary);
    }

    .url-bar {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin: 0 12px;
    }

    .url-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      outline: none;
      font-size: 14px;
    }

    .url-input::placeholder {
      color: var(--text-secondary);
    }

    .go-btn {
      padding: 6px 12px;
      background: var(--primary);
      border: none;
      border-radius: 4px;
      color: var(--bg-darkest);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .go-btn:hover {
      background: var(--secondary);
    }

    .iframe-container {
      width: 100%;
      height: calc(100vh - 56px);
      border: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .loading {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--text-secondary);
    }

    .loading.active {
      display: block;
    }
  </style>

  <script>
    // Apply color theme from parent
    const settings = JSON.parse(localStorage.getItem('studyhubSettings') || '{}');
    if (settings.colorTheme) {
      const themes = {
        'Purple': ['#b794f6', '#10b981', '#d97706'],
        'Cyan': ['#00d4ff', '#10b981', '#fbbf24'],
        'Magenta': ['#ec4899', '#10b981', '#fbbf24'],
        'Blue': ['#3b82f6', '#06b6d4', '#f59e0b'],
        'Green': ['#10b981', '#06b6d4', '#f59e0b'],
      };
      const [primary, secondary, accent] = themes[settings.colorTheme] || themes['Purple'];
      document.documentElement.style.setProperty('--primary', primary);
      document.documentElement.style.setProperty('--secondary', secondary);
      document.documentElement.style.setProperty('--accent', accent);
    }
  </script>
</head>
<body>

  <div class="navbar">
    <button class="nav-btn" onclick="goBack()">← Back</button>
    <button class="nav-btn" onclick="goForward()">Forward →</button>
    <button class="nav-btn" onclick="reload()">⟲ Reload</button>
    
    <div class="url-bar">
      <span>🔒</span>
      <input type="text" class="url-input" id="urlInput" placeholder="Enter URL...">
      <button class="go-btn" onclick="navigate()">GO</button>
    </div>
  </div>

  <div class="iframe-container">
    <iframe id="proxyFrame"></iframe>
  </div>

  <div class="loading" id="loading">
    <p>Loading...</p>
  </div>

  <script>
    const proxyFrame = document.getElementById('proxyFrame');
    const urlInput = document.getElementById('urlInput');
    const loading = document.getElementById('loading');

    // Get URL from query parameter
    const params = new URLSearchParams(window.location.search);
    const encodedUrl = params.get('url');

    if (encodedUrl) {
      try {
        const decodedUrl = atob(encodedUrl);
        loadProxyUrl(decodedUrl);
        urlInput.value = decodedUrl;
      } catch (e) {
        console.error('Failed to decode URL:', e);
        urlInput.placeholder = 'Invalid URL';
      }
    }

    function loadProxyUrl(url) {
      loading.classList.add('active');
      
      try {
        const encoded = btoa(url);
        proxyFrame.src = `/uv/service?url=${encoded}`;
        
        proxyFrame.onload = () => {
          loading.classList.remove('active');
        };
        
        setTimeout(() => {
          loading.classList.remove('active');
        }, 5000);
      } catch (e) {
        console.error('Proxy error:', e);
        loading.classList.remove('active');
      }
    }

    function navigate() {
      const url = urlInput.value.trim();
      if (url) {
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          loadProxyUrl('https://' + url);
        } else {
          loadProxyUrl(url);
        }
      }
    }

    function goBack() {
      proxyFrame.contentWindow.history.back();
    }

    function goForward() {
      proxyFrame.contentWindow.history.forward();
    }

    function reload() {
      proxyFrame.src = proxyFrame.src;
    }

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        navigate();
      }
    });
  </script>

</body>
</html>
